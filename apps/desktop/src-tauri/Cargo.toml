[package]
name = "glimpse-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Glimpse desktop runtime."

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
axum = "0.8"
dirs = "6"
futures-util = "0.3"
glimpse-bridge = { path = "../../../packages/bridge-rust" }
glimpse-core = { path = "../../../packages/core-rust" }
keyring = "3"
mdns-sd = "0.20.3"
# Cargo.lock 이 잠근 revision 을 명시해 cargo update 로 인한 조용한
# 드리프트를 방지한다.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "bed81ad4ab1a6c904b11d425608e50f976d8ea62", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"] }
# Pin TS and Rust sides together: the generated client contract hash is
# coupled to the rustra crate version (see packages/bridge-rust + @rustra/*).
# 0.1.2 published on crates.io (2026-08-17) — exact pin so a cargo update
# can never silently drift the Rust side past the pinned @rustra/* TS side.
rustra = { version = "=0.1.3", features = ["tauri"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
# Sync payloads are plain JSON snapshots that compress ~10x; gzip keeps the
# wire compatible without touching the bridge contract.
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
llm = ["llama-cpp-2"]

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }
tempfile = "3"
