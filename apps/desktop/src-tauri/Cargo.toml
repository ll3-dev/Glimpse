[package]
name = "glimpse-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Glimpse desktop runtime."

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
glimpse-core = { path = "../../../packages/core-rust" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }

[features]
default = []
