[package]
name = "glimpse-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Glimpse desktop runtime."

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
dirs = "6"
futures-util = "0.3"
glimpse-bridge = { path = "../../../packages/bridge-rust" }
glimpse-core = { path = "../../../packages/core-rust" }
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", branch = "main", optional = true }
reqwest = { version = "0.12", features = ["stream"] }
# Pin TS and Rust sides together: the generated client contract hash is
# coupled to the rustra crate version (see packages/bridge-rust + @rustra/*).
#
# TEMPORARY local path link for week-3 development (event push + streaming
# switch): rustra 0.1.2 is not on crates.io yet. The rustra checkout lives
# OUTSIDE this repo, hence the upward relative path. Replace with
# `rustra = { version = "=0.1.2", features = ["tauri"] }` once published.
rustra = { path = "../../../../rustra-bridge/crates/rustra", features = ["tauri"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1", features = ["fs", "io-util"] }

[features]
default = []
llm = ["llama-cpp-2"]

[dev-dependencies]
serde_json = "1.0"
tauri = { version = "2.0.0", features = ["test"] }
tempfile = "3"
