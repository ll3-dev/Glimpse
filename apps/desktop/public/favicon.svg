<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="macShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="warmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f3ef"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle with Native Shadow (macOS / iOS / Desktop standard) -->
  <rect x="100" y="96" width="824" height="824" rx="185" fill="url(#warmBg)" filter="url(#macShadow)" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5"/>
  
  <!-- Inner Brand Mark -->
  <rect x="284" y="280" width="456" height="456" rx="152" fill="#37352f"/>
  
  <!-- Accent Eye / Glimpse Notch -->
  <rect x="532" y="354" width="144" height="144" rx="54" fill="#ffe8d4"/>
</svg>
