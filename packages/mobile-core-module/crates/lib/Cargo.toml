[package]
name = "glimpsecore"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
craby = "0.1.0-rc"
cxx = { version = "1.0.187", features = ["c++20"] }
glimpse-core-rs = { path = "../../../core-rs" }

[build-dependencies]
craby_build = { version = "0.1.0-rc", features = ["cxx"] }

[lib]
name = "glimpsecore"
crate-type = ["staticlib"]
