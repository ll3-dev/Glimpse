[package]
name = "glimpse-bridge"
version = "0.1.0"
edition = "2021"
description = "rustra bridge commands over glimpse-core (desktop + mobile)."

[lib]
# "lib" keeps the Tauri/desktop and cargo test paths working; "staticlib" adds
# the C-ABI .a consumed by the iOS/Android mobile shells (rustra FFI symbols).
crate-type = ["lib", "staticlib"]

[dependencies]
glimpse-core = { path = "../core-rust" }
# Pin TS and Rust sides together: the generated client contract hash is
# coupled to the rustra crate version (see apps/desktop + @rustra/*).
# Exact pin so a cargo update can never silently drift the Rust side past
# the pinned @rustra/* TS side.
rustra = "=0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Sync peer discovery (sync_discover) backends are per-platform: desktop
# uses mdns-sd (same crate the desktop server advertises with, kept
# version-locked so browse/advertise stay compatible); iOS uses the
# system dnssd C API (entitlement-free Bonjour); Android uses JNI→
# NsdManager (orchestrated from Rust; a minimal Kotlin adapter implements
# the DiscoveryListener interface — a Java interface cannot be implemented
# from pure Rust). See sync_discovery/.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
mdns-sd = "0.20.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
