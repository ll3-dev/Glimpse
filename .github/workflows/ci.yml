name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (lint / typecheck / coverage / web / audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run desktop:lint
      - run: bun run typecheck
      - run: bun run desktop:typecheck
      - run: bun run test:coverage
      - run: bun test packages/features/src apps/desktop/src --coverage
      - run: bun run web:export
      - run: bun run audit:critical
      - uses: actions/upload-artifact@v7
        with:
          name: web-static-export
          path: apps/mobile/dist-web
          if-no-files-found: error

  rust:
    name: Rust (test / clippy / check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 데스크톱 크레이트가 pkg-config로 시스템 glib/gtk를 찾는다.
      # macOS 러너에는 기본 있지만 ubuntu-latest에는 없어 설치가 필요하다.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # generate_context!가 frontendDist(../dist)를 임베드한다 — 사전 웹 빌드 필요
      - run: bun run desktop:build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun run bridge:generate
      - run: git diff --exit-code -- packages/bridge-rust/generated packages/bridge-generated
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  android-release:
    name: Android Release (arm64 AAB, unsigned validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --platform 24 -t arm64-v8a build -p glimpse-bridge --release
      - run: mkdir -p apps/mobile/android/glimpse-core/libs/arm64-v8a
      - run: cp target/aarch64-linux-android/release/libglimpse_bridge.a apps/mobile/android/glimpse-core/libs/arm64-v8a/libglimpse_bridge.a
      - run: ./gradlew :app:bundleRelease -Pglimpse.allowUnsignedRelease=true -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned-validation
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-release:
    name: iOS Release (simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/mobile build:bridge:ios
      - run: pod install --repo-update
        working-directory: apps/mobile/ios
      - run: >-
          xcodebuild -workspace glimpse.xcworkspace -scheme glimpse
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios
