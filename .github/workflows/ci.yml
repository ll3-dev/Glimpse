name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 주간 일요일 18:23 UTC (월요일 새벽 KST) — 네이티브 릴리스 검증·audit high 게이트
    - cron: "23 18 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (lint / typecheck / coverage / web / audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run desktop:lint
      - run: bun run typecheck
      - run: bun run desktop:typecheck
      - run: bun run test:coverage
      - run: bun test packages/features/src apps/desktop/src --coverage
      - run: bun run web:export
      - run: bun run audit:critical
      - uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: apps/mobile/dist-web
          if-no-files-found: error

  rust:
    name: Rust (test / clippy / check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 데스크톱 크레이트가 pkg-config로 시스템 glib/gtk를 찾는다.
      # macOS 러너에는 기본 있지만 ubuntu-latest에는 없어 설치가 필요하다.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # generate_context!가 frontendDist(../dist)를 임베드한다 — 사전 웹 빌드 필요
      - run: bun run desktop:build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: bun run bridge:generate
      - run: git diff --exit-code -- packages/bridge-rust/generated packages/bridge-generated
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      # bundler 직전까지의 "빌드 가능성" 검증 — debug 프로필 캐시를 위 스텝과 공유해 순증가분 최소.
      # 전체 번들(.deb/.dmg)은 weekly-bundle 잡이 주간으로 대신 검증한다.
      - name: Tauri debug build validation (no bundle)
        run: cd apps/desktop && bunx tauri build --debug --no-bundle

  audit-high:
    # transitive advisory(expo/RN/eslint/vite 하위)가 많아 main 레인에 두면 항상 레드.
    # 주간 스케줄 + 수동 실행에서만 평가하고, 메인 푸시 게이트는 audit:critical만 유지한다.
    name: Audit (weekly, high)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  paths:
    # android/ios-release를 관련 경로 변경시에만 돌리기 위한 필터(주간 cron엔 무조건 실행).
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mobile-native: ${{ steps.filter.outputs.mobile-native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile-native:
              - 'packages/bridge-rust/**'
              - 'packages/core-rust/**'
              - 'apps/mobile/ios/**'
              - 'apps/mobile/android/**'
              - 'apps/mobile/modules/**'
              - 'apps/mobile/package.json'
              - 'bun.lock'

  android-release:
    name: Android Release (arm64 AAB, unsigned validation)
    needs: paths
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.paths.outputs.mobile-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --platform 24 -t arm64-v8a build -p glimpse-bridge --release
      - run: mkdir -p apps/mobile/android/glimpse-core/libs/arm64-v8a
      - run: cp target/aarch64-linux-android/release/libglimpse_bridge.a apps/mobile/android/glimpse-core/libs/arm64-v8a/libglimpse_bridge.a
      - run: ./gradlew :app:bundleRelease -Pglimpse.allowUnsignedRelease=true -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned-validation
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-release:
    name: iOS Release (simulator, unsigned)
    needs: paths
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.paths.outputs.mobile-native == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      # expo-modules-core 소스의 Swift 동시성 어노테이션이 특정 Xcode와 호환성이 깨진다.
      # 러너 기본값(Xcode_16.4)은 실패하므로 이미지에 설치된 최신 Xcode로 시도한다(best-effort).
      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app | sort -V | tail -1
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/mobile build:bridge:ios
      - run: pod install --repo-update
        working-directory: apps/mobile/ios
      - run: >-
          xcodebuild -workspace glimpse.xcworkspace -scheme glimpse
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios

  weekly-bundle:
    # 번들 단계(.deb 아이콘·plist·설정 파일) 검증 — 매 PR 비용 대비 가치가 낮아 주간으로만.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Desktop bundle (weekly, deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run desktop:build
      - run: cd apps/desktop && bunx tauri build --debug --bundles deb
